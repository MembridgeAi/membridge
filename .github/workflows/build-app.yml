# Builds the MemBridge tray app for macOS (menu bar) and Windows (system tray)
# on their native runners. Runs on every push to master (fresh artifact per
# push), on manual dispatch, and on every published release; release builds are
# attached to the release as downloadable zips.
name: Build app

on:
  push:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A plain install now brings the MCP SDK + zod with it. Mirrors ci.yml.
      - run: npm install
      # The React UI is a separate npm workspace and the ONLY UI the app has --
      # the legacy dashboard was deleted in 0.2.0. Without these two steps
      # prepare-app.js packaged a UI-less app and v0.2.0 shipped a window whose
      # entire contents were "UI not built". Mirrors ci.yml, including
      # `working-directory:` over `cd ui &&` (POSIX-only, breaks the Windows
      # leg) and the build running BEFORE the root suite, whose /app
      # static-serving checks need a real ui/dist.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: node test/run-tests.js
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: membridge-mac
          path: dist/*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Same as the mac job: ui/ is the only UI the app has. `working-directory:`
      # rather than `cd ui &&` matters most here -- this leg is cmd.exe.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: node test/run-tests.js
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: membridge-win
          path: dist/*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        # Git Bash on the Windows runner, so the glob + $TAG match the mac job.
        shell: bash
        run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
