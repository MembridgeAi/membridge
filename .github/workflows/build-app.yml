# Builds the MemBridge tray app for macOS (menu bar) and Windows (system tray)
# on their native runners. Runs on every push to master (fresh artifact per
# push), on manual dispatch, and on every published release; release builds are
# attached to the release as a signed+notarized mac dmg and zip, and a
# windows zip.
#
# RECOVERY PATH (born from v0.3.4 shipping no Windows asset): assets are only
# attached when this run resolves a release tag, and the release-event run is
# the code AS OF THE TAG -- so when a leg fails there (v0.3.4: the windows job,
# fixed on master only after the tag), re-running it just fails again, and a
# later push-triggered green build never uploads. Instead of cutting a whole
# new version to re-trigger the release event, dispatch this workflow from the
# fixed ref with the `release_tag` input set to the existing tag:
#   gh workflow run build-app.yml --ref master -f release_tag=v0.3.4
# That run builds from the dispatched ref and attaches the assets (plus the
# unversioned aliases membridge.app links) to that release. A failed attach is
# already loud -- every attach step sits downstream of the test suite and a
# red step fails the run -- the gap this input closes is that a red release
# run previously had no way to complete short of a new version.
name: Build app

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag (e.g. v0.3.4) to attach the built assets to.
          Leave empty for a plain build with no upload.
        required: false
        default: ''
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    # `secrets` is NOT a context you can read from a step-level `if:` (only
    # job-level `env:` can see it), so signing availability is resolved once
    # here and every step below keys off these two flags instead. A fork, or a
    # PR from a fork, sees empty secrets: both come out "false" and the job
    # still produces an unsigned build exactly as it did before, rather than
    # failing on missing credentials.
    #
    # MB_CAN_NOTARIZE deliberately repeats the two signing secrets rather than
    # referring to MB_CAN_SIGN (entries in the same env block cannot reference
    # each other): notarizing an app that was never signed is a guaranteed
    # failure, so a half-configured secret set must fall back to plain
    # unsigned rather than to sign-less notarization.
    env:
      MB_CAN_SIGN: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
      MB_CAN_NOTARIZE: >-
        ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != ''
        && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != ''
        && secrets.APPLE_API_ISSUER != '' }}
      # The release tag the attach steps upload to, resolved ONCE so the two
      # trigger paths (release event, recovery dispatch -- see header) cannot
      # drift: the release event carries its own tag, a dispatch carries the
      # release_tag input, and everything else leaves this empty, which is
      # what gates every "Attach ..." step off. `||` picks the first non-empty
      # operand; on a push both are empty strings.
      MB_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A plain install now brings the MCP SDK + zod with it. Mirrors ci.yml.
      - run: npm install
      # The React UI is a separate npm workspace and the ONLY UI the app has --
      # the legacy dashboard was deleted in 0.2.0. Without these two steps
      # prepare-app.js packaged a UI-less app and v0.2.0 shipped a window whose
      # entire contents were "UI not built". Mirrors ci.yml, including
      # `working-directory:` over `cd ui &&` (POSIX-only, breaks the Windows
      # leg). ui build MUST stay before both Package (electron-builder copies
      # ui/dist into the app) and node test/run.js (its /app static-serving
      # checks need a real ui/dist).
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # node test/run.js used to sit here, before Package. That ordering meant
      # a failing suite killed the job before the signed+notarized zip was
      # ever built, so a red install-integrity check (or any other suite)
      # blocked the download install.sh reads its SHA from -- chicken and egg,
      # since install.sh's pin IS what install-integrity checks. The suite
      # now runs AFTER upload-artifact, so the artifact exists whether or not
      # tests are green, while "Attach to release" remains downstream of the
      # suite and inherits the default step-fails-skips-later-steps gate.
      # The App Store Connect key is base64 in the secret, but electron-builder
      # passes APPLE_API_KEY straight to notarytool as a FILE PATH, so it has
      # to be decoded onto disk. It goes in RUNNER_TEMP rather than the
      # workspace so no packaging glob or upload-artifact path can ever sweep
      # it into a published artifact, and it is deleted below whatever happens.
      - name: Write the App Store Connect API key
        if: env.MB_CAN_NOTARIZE == 'true'
        env:
          # Via env, never inlined into the script: an inlined ${{ secrets.* }}
          # is pasted into the shell before it runs.
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      # One packaging step for both the signed and unsigned paths, so they
      # cannot drift apart. Everything is driven by whether the values are
      # empty: electron-builder tests `CSC_IDENTITY_AUTO_DISCOVERY !== "false"`,
      # and its notarization step is skipped with a warning (not an error) when
      # the APPLE_API_* trio is absent, which is what makes the unsigned
      # fallback work without a second step. package.json build.mac leaves
      # `notarize` unset ON PURPOSE: unset means "notarize exactly when
      # credentials are present", which is the guard that lets forks and PR
      # builds succeed with no secrets at all. Do not set notarize:false there.
      - name: Package
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MB_CAN_SIGN }}
          # Must stay empty unless ALL THREE are available: electron-builder
          # throws InvalidConfigurationError when APPLE_API_KEY is set and
          # either of the other two is not, so pointing this at the temp path
          # unconditionally would fail every fork build.
          APPLE_API_KEY: ${{ env.MB_CAN_NOTARIZE == 'true' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Read only by the APPLE_ID/app-specific-password notarization path,
          # not the API-key path used here. Passed so that switching paths is a
          # workflow edit rather than a secrets change.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Notarizing leaves the ticket on Apple's servers. Gatekeeper fetches it
      # over the network the first time the artifact is opened, so an offline or
      # proxied machine shows the "cannot be opened" panel for a build that IS
      # properly notarized. Stapling writes the ticket into the artifact itself.
      #
      # electron-builder notarizes and staples the .app. It then builds the dmg
      # AROUND that app as a separate container which Apple has never seen, so
      # the dmg has no ticket of its own and none can be fetched: `stapler
      # staple` on it asks CloudKit for a record keyed by the dmg's hash and
      # gets "Record not found", exit 65. The dmg has to be submitted in its own
      # right first. A previous attempt at this step stapled without submitting
      # and took the whole mac job down, which is why the submit is here.
      #
      # The dmg is what membridge.app links, so it is the artifact users meet.
      #
      # v0.1.2 shipped stapled, v0.2.4 did not, and every check stayed green
      # because nothing looked. `stapler validate` is the gate that closes that:
      # it runs under `set -e` and takes the build down rather than warning,
      # because a warning is indistinguishable from the silence we already had.
      #
      # Runs BEFORE the key is deleted: stapling needs only the network, but
      # `notarytool submit` needs the credentials, so the key has to outlive it.
      - name: Notarize and staple the dmg, and prove the staple stuck
        if: env.MB_CAN_NOTARIZE == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          # An empty glob here means packaging changed shape, not that there is
          # nothing to do. Failing loudly beats silently stapling nothing,
          # which is indistinguishable from the bug this step exists to close.
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "no dmg found in dist/ to staple; packaging must have changed" >&2
            exit 1
          fi
          for f in "${dmgs[@]}"; do
            echo "submitting $f for notarization"
            xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
            echo "stapling $f"
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done
      # if: always() -- a failed or cancelled packaging step must not leave a
      # usable signing key on the runner.
      - name: Delete the App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: membridge-mac
          # Both targets: the dmg is what membridge.app links, the zip is what
          # install.sh fetches.
          path: |
            dist/*.zip
            dist/*.dmg
      # Runs AFTER upload-artifact on purpose: a red suite must not swallow
      # the signed artifact, but it MUST still block "Attach to release"
      # below via the default step-fails-skips-later-steps gate, so a release
      # cut cannot ship an untested asset.
      - run: node test/run.js
      - name: Attach to release
        if: env.MB_RELEASE_TAG != ''
        run: gh release upload "$TAG" dist/*.zip dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.MB_RELEASE_TAG }}
      # membridge.app links releases/latest/download/MemBridge-arm64.dmg -- an
      # UNVERSIONED name, while electron-builder only ever emits versioned ones
      # (MemBridge-0.2.0-arm64.dmg). The unversioned aliases were hand-uploaded
      # to v0.1.2 and to nothing since, so v0.2.0 became "latest" without them
      # and that button is 404ing right now. Re-uploading the alias on EVERY
      # release is what stops the next release breaking it again.
      - name: Attach unversioned download alias to release
        if: env.MB_RELEASE_TAG != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(dist/*-arm64.dmg)
          # Fail loudly rather than alias whichever file sorted first: a silent
          # wrong pick would publish a download button pointing at the wrong
          # artifact, which is the failure this step exists to prevent.
          if [ ${#built[@]} -ne 1 ]; then
            echo "expected exactly one arm64 dmg in dist/, found ${#built[@]}: ${built[*]-none}" >&2
            exit 1
          fi
          # Staged OUTSIDE dist/ so the globs above can never sweep the alias
          # up and publish the same bytes twice under two names. mktemp rather
          # than $RUNNER_TEMP to keep this identical to the windows job, where
          # $RUNNER_TEMP is a backslash path that Git Bash mangles.
          stage=$(mktemp -d)
          cp "${built[0]}" "$stage/MemBridge-arm64.dmg"
          gh release upload "$TAG" "$stage/MemBridge-arm64.dmg" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.MB_RELEASE_TAG }}

  windows:
    runs-on: windows-latest
    env:
      # Same single-point resolution as the mac job; the two jobs must agree
      # on what "this run uploads" means or a recovery dispatch would attach
      # half a release.
      MB_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Same as the mac job: ui/ is the only UI the app has. `working-directory:`
      # rather than `cd ui &&` matters most here -- this leg is cmd.exe.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # Same reorder as the mac job: Package + upload-artifact BEFORE the
      # root suite, so a red suite cannot swallow the built zip. The suite
      # still gates "Attach to release" below via the default
      # step-fails-skips-later-steps behaviour.
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: membridge-win
          path: dist/*.zip
      - run: node test/run.js
      - name: Attach to release
        if: env.MB_RELEASE_TAG != ''
        # Git Bash on the Windows runner, so the glob + $TAG match the mac job.
        shell: bash
        run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.MB_RELEASE_TAG }}
      # The other half of the 404: membridge.app links
      # releases/latest/download/MemBridge-win.zip. Same reasoning as the mac
      # alias above.
      - name: Attach unversioned download alias to release
        if: env.MB_RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(dist/*.zip)
          if [ ${#built[@]} -ne 1 ]; then
            echo "expected exactly one zip in dist/, found ${#built[@]}: ${built[*]-none}" >&2
            exit 1
          fi
          stage=$(mktemp -d)
          cp "${built[0]}" "$stage/MemBridge-win.zip"
          gh release upload "$TAG" "$stage/MemBridge-win.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.MB_RELEASE_TAG }}
