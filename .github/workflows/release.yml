# Publishes to npm when a GitHub release is published.
# Requires an npm automation token saved as the NPM_TOKEN repo secret
# (npmjs.com -> Access Tokens -> Generate New Token -> Automation).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Prod deps from the lockfile, which now includes the MCP SDK + zod.
      # No side-install — mirrors ci.yml.
      - run: npm ci --omit=dev --no-audit --no-fund
      # ui/ deps and build, in steps of their own, BEFORE the suite. Since
      # ui/dist ships in the tarball, `npm pack` (which the suite runs) and
      # `npm publish` below both fire prepack, and prepack builds the UI. If
      # ui/node_modules is absent at that point, prepack's fallback runs
      # `npm ci` INSIDE the npm lifecycle script, and that nested install
      # inherits `omit=dev` from the parent npm process: the dev-only type
      # packages tsconfig requires go missing and `tsc --noEmit` fails, so the
      # publish never runs. A separate step does not inherit it, which is why
      # ci.yml and build-app.yml were always fine and this file was not.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: node test/run-tests.js
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
