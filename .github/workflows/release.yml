# Publishes to npm when a GitHub release is published.
#
# Uses npm TRUSTED PUBLISHING (OIDC), not a token. npm began restricting
# 2FA-bypass tokens in early August 2026: they can no longer change package or
# account settings, and they lose direct-publish entirely around January 2027.
# A token also cannot satisfy a package whose publish gate is set to require
# 2FA, which is what blocked the 0.2.4 publish with EOTP.
#
# The trust relationship is configured on npmjs.com against THIS repository and
# THIS filename (release.yml). Renaming this file breaks publishing until the
# npm-side config is updated to match.
#
# No NPM_TOKEN is needed. Provenance is automatic for a public repository under
# trusted publishing, so --provenance is not passed explicitly.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache in a release build: a stale cache is how a publish ends
          # up shipping something other than what the tag contains.
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1, so the runner's bundled npm is
      # not assumed. PINNED, not @latest: @latest pulled an npm whose
      # `npm pack --json` returns an object keyed by package name instead of an
      # array of manifests, which broke the tarball check and blocked the
      # publish twice. A release pipeline must not change behavior because npm
      # shipped that morning. Raise this deliberately, with the suite green.
      - run: npm install -g npm@11.13.0
      # Prod deps from the lockfile, which now includes the MCP SDK + zod.
      # No side-install — mirrors ci.yml.
      - run: npm ci --omit=dev --no-audit --no-fund
      # ui/ deps and build, in steps of their own, BEFORE the suite. Since
      # ui/dist ships in the tarball, `npm pack` (which the suite runs) and
      # `npm publish` below both fire prepack, and prepack builds the UI. If
      # ui/node_modules is absent at that point, prepack's fallback runs
      # `npm ci` INSIDE the npm lifecycle script, and that nested install
      # inherits `omit=dev` from the parent npm process: the dev-only type
      # packages tsconfig requires go missing and `tsc --noEmit` fails, so the
      # publish never runs. A separate step does not inherit it, which is why
      # ci.yml and build-app.yml were always fine and this file was not.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The suite is NOT run as a step of its own here, deliberately.
      # package.json's prepublishOnly is `npm test`, so `npm publish` below
      # runs it anyway, and an explicit step meant the whole suite ran TWICE
      # in one job. That is not merely wasteful: the second run FAILED while
      # the first passed, sixty seconds apart on identical code (v0.2.8:
      # 1487/1487, then 1482/1487 with three `commits:` checks down). The
      # suite is one sequential story over real git subprocesses and it is
      # not idempotent within a job, so the first run poisons the second and
      # a good build cannot publish.
      #
      # prepublishOnly is kept as THE gate rather than the step, because it
      # also guards a publish run by hand, which a workflow step cannot.
      # The underlying non-idempotency is a real bug and is filed separately;
      # this stops it blocking releases.
      - run: npm publish --access public
