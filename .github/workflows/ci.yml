name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is load-bearing, not decoration: it is the ONLY place
        # lib/keychain.js's DPAPI backend is ever executed. The keychain(win)
        # checks in test/run-tests.js print a visible skip everywhere else, so
        # dropping this leg silently removes all coverage of Windows private-key
        # storage while the suite still reports green.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # This matrix and package.json's `engines` used to DISAGREE ON PURPOSE:
        # 18 was dropped here because the ui leg could not build on it (Vite 8
        # via rolldown imports styleText from node:util, added in Node 20),
        # while `engines` stayed at >=18 because that is a BUILD-time constraint
        # and the npm tarball ships only bin, lib and vendor -- an npm consumer
        # never runs vite. Verified then on real Node 18.20.8.
        #
        # That reasoning no longer applies, and the distinction it turned on is
        # exactly why. lib/search-index.js requires node:sqlite, which is a
        # RUNTIME dependency of the CLI and the daemon themselves, unflagged
        # only from 22.13. A Node 20 consumer does not get a degraded build;
        # they get a throw on require. So `engines` is now genuinely >=22 and
        # this matrix follows it rather than disagreeing with it.
        #
        # 24 is here because it is what the Electron runtime we ship embeds
        # (Electron 43 = Node 24.18), so the desktop app's actual runtime has
        # coverage and not just the declared floor.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Prod deps from the lockfile (tests exercise libsodium-wrappers and the
      # MCP SDK), minus devDependencies — electron/electron-builder are heavy
      # and unused by the suite. No side-install: the MCP SDK and zod are
      # ordinary dependencies now, and CI must fail if they ever stop being.
      - run: npm ci --omit=dev --no-audit --no-fund
      # The React UI (ui/) is its own npm workspace with its own devDeps
      # (vite, vitest, @testing-library) that the build and tests need, so
      # this installs full (not --omit=dev), unlike the root step above.
      # `working-directory:` is used instead of `cd ui &&` because the latter
      # is a POSIX-only chain that breaks in cmd.exe/PowerShell — the whole
      # point of running this leg on windows-latest.
      - run: npm ci
        working-directory: ui
      # Build BEFORE the root suite: its /app static-serving checks need a real
      # ui/dist, and ui/dist is gitignored, so a fresh checkout has none. With
      # the build after, those checks skipped on every CI run and the route
      # shipped exercised only on machines that happened to have a local build.
      - run: npm run build
        working-directory: ui
      - run: node test/run.js
      - run: npx vitest run
        working-directory: ui
