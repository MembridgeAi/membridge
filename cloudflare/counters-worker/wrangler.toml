name = "membridge-counters"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Anonymous product-health counters. Writes to Analytics Engine only — this
# Worker holds no secrets and no binding to Supabase, deliberately (see
# src/index.js's header and spec §2).
[[analytics_engine_datasets]]
binding = "COUNTERS"
dataset = "membridge_counters"

# HOSTNAME IS AN OPEN DECISION — do not just pick one.
#
# membridge.app is on name.com nameservers, not Cloudflare, so no hostname under
# it can be routed here until that zone moves. membridge.me IS on Cloudflare and
# works today.
#
# The catch: this URL is baked into lib/counters-backend.json at build time, and
# every shipped client keeps pointing at whatever it was built with. Old installs
# never update it. So whichever hostname is chosen has to keep answering more or
# less forever — this is not a decision to make casually to unblock a deploy.
#
#   wrangler deploy
#   (then add the route in the Cloudflare dashboard, or uncomment below)
#
# [[routes]]
# pattern = "counters.membridge.me"   # or counters.membridge.app once that zone moves
# custom_domain = true

# RECOMMENDED, set in the dashboard rather than here (rate limiting rules are
# not expressible in wrangler.toml): a rate limit on this hostname of ~10
# requests per minute per IP. A healthy install sends at most one request per
# state change and one per day; anything above that is a bug or an attack.
