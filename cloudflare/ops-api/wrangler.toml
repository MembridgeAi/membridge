name = "membridge-ops-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# CRITICAL: no workers.dev route. The only way in is the Cloudflare
# Access-protected hostname, so the Access edge check cannot be bypassed by
# hitting a *.workers.dev URL directly. The Worker also verifies the Access JWT
# itself (src/index.js) — this is the belt, that is the braces.
workers_dev = false

# A PATH route, not a custom_domain: ops.membridge.me already belongs to the
# Pages project, and the panel calls /api on its own origin because same-origin
# is half the CSRF defence (see src/index.js). Workers routes take precedence
# over Pages on the same hostname, so this claims /api* and Pages keeps the rest.
[[routes]]
pattern = "ops.membridge.me/api*"
zone_name = "membridge.me"

# Non-secret config.
[vars]
ACCESS_TEAM_DOMAIN = "weathered-sky-8f4e.cloudflareaccess.com"
ACCESS_AUD = "ce8ae1ef05b71f3245bd11441a382d6f2c9bbbd0b7a23840e96b34dfc3a66646"
ALLOWED_EMAILS = "marco@melika.me,marco@melika.com,andrewludwigbrown@gmail.com"
# Not secrets, so they live here rather than as `wrangler secret put` prompts.
# The account id appears in every dashboard URL; the Supabase project URL already
# ships publicly in lib/backend.json. Treating non-secrets as secrets just adds
# steps and makes the two that ARE sensitive easier to lose track of.
CF_ACCOUNT_ID = "a699188326d9ffcbf6499e943228a8f2"
SUPABASE_URL = "https://mefgbiecvoszjorwzkfz.supabase.co"
# Team ids to leave out of every business figure — the operator's own
# dogfooding teams. JSON array of uuids, or [] for everything.
EXCLUDE_TEAMS = "[]"

# Secrets — exactly TWO, and NEVER in this file. Set with
# `wrangler secret put <NAME>` (it prompts; the value never touches your shell
# history or argv):
#   CF_API_TOKEN          scoped to Account Analytics: Read, nothing else
#   SUPABASE_SERVICE_KEY  Supabase service role key
#
# On SUPABASE_SERVICE_KEY, stated plainly rather than hidden: this is the one
# high-privilege credential in the design. It is required because ops_snapshot()
# is granted to service_role only (migration 019) — anon is the public internet
# and authenticated is every signed-in customer, so neither can be used.
#
# CORRECTION. This paragraph used to list among its mitigations that the key "is
# used for exactly one RPC that returns aggregates". That is false and it
# understated the key in the one place written to explain its risk: the Worker
# uses it for EIGHT RPCs, four of which WRITE (ops_set_team_note,
# ops_set_team_internal, ops_rotate_invite, ops_create_onboarding_invite — see
# the ACTIONS table in src/index.js). ops_create_onboarding_invite mints a token
# that redeem_onboarding_invite turns into a new team. And service_role has
# rolbypassrls with read+write on every public table, so what the key can do is
# not bounded by what this Worker chooses to call.
#
# The mitigations that ARE true: it lives only as a Worker secret, this Worker
# is the sole holder, and the Worker has no route reachable without Access. If
# this Worker is ever compromised, rotate this key first.
#
# SUPERSEDED BY migration 047, which creates two scoped roles — ops_panel_read
# and ops_panel_write — with EXECUTE on their own subset of those eight RPCs, no
# rolbypassrls and no table privileges at all. Once OPS_READ_KEY and
# OPS_WRITE_KEY are set and the Worker is deployed, this key is no longer used
# at runtime. It is deliberately kept until then because it is the rollback
# (`wrangler rollback`); removing it is a later, separate step. See
# supabase/APPLY-RUNBOOK.md.
